<script>// v16-260 AUTO GRAPHICS (Marius, 23 nov 2026): at the first start the game checks the phone once (memory, CPU cores, a short speed test).
// Good phones get HD by themselves, normal phones STANDARD, weak phones LOW (lighter picture, no lag). PROFILE → GRAPHICS: AUTO / HD / STANDARD / LOW.
// If AUTO chose too high and the battles are slow, it goes one step down by itself (saved for the next start).
window.GFX=(()=>{const L=k=>{try{return localStorage.getItem(k);}catch(e){return null;}},S=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
  const man=L('te_hd')==='1'?'hd':/^(std|low)$/.test(L('te_gfx')||'')?L('te_gfx'):'auto';
  const TP=(L('te_tier')||'').split('|');let tier=TP[0],sc=+(TP[1]||0);
  // v16-263: LOW chosen ONLY by the speed test (the phone was busy?) is checked again at the next start → the better result counts
  if(!/^(hi|mid|lo)$/.test(tier)||TP[2]==='p'){const old=TP[2]==='p'?sc:0;
    const b=()=>{const t0=performance.now();let x=0;const a=new Float64Array(4096);for(let i=0;i<300000;i++){const j=i&4095;a[j]=a[j]*.5+Math.sqrt(i);x+=a[(i*7)&4095];}
      const o=[];for(let i=0;i<20000;i++)o.push({i,v:i*1.5});o.sort((p,q)=>q.v-p.v);return performance.now()-t0+(x>1e300?1:0)+(o[0].i<0?1:0);};
    try{sc=Math.round(b()+b()+b());}catch(e){sc=60;}if(old)sc=Math.min(sc,old);
    const mem=navigator.deviceMemory||0,cores=navigator.hardwareConcurrency||4,dpr=window.devicePixelRatio||1,weak=(mem&&mem<=3)||cores<=4;
    tier=weak||sc>100?'lo':(!mem||mem>=6)&&cores>=6&&dpr>=2&&sc<70?'hi':'mid';
    S('te_tier',tier+'|'+sc+(tier==='lo'&&!weak&&!old?'|p':''));}
  // v16-266 (Marius 23 nov: freeze at Alex): AUTO never turns HD on by itself any more (3× picture = a lot of memory) – good phones get STANDARD (2×, as before v16-260); HD only if the player chooses it
  const eff=man==='auto'?(tier==='lo'?'low':'std'):man;
  return {man,tier,sc,eff,hd:eff==='hd',low:eff==='low',auto:man==='auto',
    set(v){S('te_hd',v==='hd'?'1':null);S('te_gfx',v==='std'||v==='low'?v:null);},
    down(){if(man!=='auto'||tier==='lo')return;S('te_tier',(tier==='hi'?'mid':'lo')+'|'+sc);}};})();
</script>

// v16-12: old Chrome / WebView (e.g. Chrome 95 on Android 12) can't read colors like #fff1c1cc (#RRGGBBAA) in canvas → crashed the battle.
// If the phone doesn't understand them, translate them to rgba() automatically.
(function(){try{const t=document.createElement('canvas').getContext('2d');t.fillStyle='#ff000080';if(/^rgba/.test(t.fillStyle))return;
  const fix=v=>{if(typeof v!=='string'||v[0]!=='#')return v;let h=v.slice(1);if(h.length===4)h=h.split('').map(c=>c+c).join('');
    if(h.length!==8||/[^0-9a-f]/i.test(h))return v;const n=parseInt(h,16);return 'rgba('+(n>>>24&255)+','+(n>>>16&255)+','+(n>>>8&255)+','+((n&255)/255).toFixed(3)+')';};
  const G=CanvasGradient.prototype,ac=G.addColorStop;G.addColorStop=function(o,c){return ac.call(this,o,fix(c));};
  const C=CanvasRenderingContext2D.prototype;['fillStyle','strokeStyle','shadowColor'].forEach(k=>{const d=Object.getOwnPropertyDescriptor(C,k);if(d&&d.set)Object.defineProperty(C,k,{get:d.get,set:function(v){d.set.call(this,fix(v));},configurable:true});});
}catch(e){}})();
</script>

<script>// v16-263 (Marius 23 nov 2026): GAME ERRORS – a JavaScript error on a player's phone is sent to Torque Guard (/admin „🐞 Game errors”):
// the message, file:line, game version, graphics, phone. Max 5 different errors a session, each only once. No personal data.
(()=>{const seen=new Set();let q=[],n=0,tm=0;
  function send(){tm=0;const api=window.SEC&&SEC.api&&SEC.api();if(!api){if(q.length)tm=setTimeout(send,5000);return;}
    const b=q;q=[];b.forEach(e=>{try{fetch(api+'/api/err',{method:'POST',headers:{'content-type':'application/json'},keepalive:true,
      body:JSON.stringify({pid:window.SEC&&SEC.PID,cv:window.TE_CV||0,g:window.GFX?GFX.eff+'/'+GFX.tier:'',ua:navigator.userAgent,...e})}).catch(()=>{});}catch(x){}});}
  // v16-272: the stack (first 4 lines) goes too, and file:line is taken from the stack – the real place of the error, not the re-throw
  function stk(x){return String(x||'').split('\n').map(r=>r.trim()).filter(r=>/^at |@/.test(r)).slice(0,4).join(' ← ').split(location.origin).join('').replace(/\?[^:\s)]*/g,'').slice(0,400);}
  function add(m,s,l,st){m=String(m||'').slice(0,300);if(!m||/^Script error\.?$/.test(m)||/ResizeObserver loop/.test(m))return;
    st=stk(st);const f=String(st).match(/(\/[^\s():]*\.(?:html|js)):(\d+):\d+/);if(f){s=f[1];l=f[2];}
    s=String(s||'').replace(location.origin,'').split('?')[0];const k=m+'|'+s+'|'+l;if(seen.has(k)||n>=5)return;seen.add(k);n++;q.push({m,s,l:+l||0,st});if(!tm)tm=setTimeout(send,3000);}
  window.TE_ERR=e=>{try{add(e&&e.message||e,'',0,e&&e.stack);}catch(x){}};
  addEventListener('error',e=>{if(e&&e.target&&e.target!==window&&!e.error)return;add(e.message||(e.error&&e.error.message),e.filename,e.lineno,e.error&&e.error.stack);});
  addEventListener('unhandledrejection',e=>{const r=e&&e.reason;if(!r||r.name==='AbortError')return;add('(promise) '+(r.message||r),'',0,r.stack);});
})();</script>

function goRoute(o,dt,v){const p=o.p;
  while(o.route.length){const q=o.route[0],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<.5){o.route.shift();continue;}

  p.moving=false;return true;}
function goTo(p,q,dt,v){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<1){p.moving=false;return true;}
  const mv=Math.min(d,v*dt);p.x+=dx/d*mv;p.y+=dy/d*mv;p.a=lerpA(p.a,Math.atan2(dy,dx),Math.min(1,dt*10));p.moving=true;return d-mv<1;}

function stepCop(c,dt){if(!c.path.length)return true;const p=c.path[0],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy);

  const ta=Math.atan2(dy,dx);let sp=c.v;if(angDiff(c.a,ta)>.6)sp*=.4;if(c.path.length<=2&&d<40&&c.mode!=='chase')sp*=Math.max(.3,d/40);
  c.a=lerpA(c.a,ta,Math.min(1,dt*7));const mv=Math.min(d,sp*dt);c.x+=dx/d*mv;c.y+=dy/d*mv;return false;}

function clampCam(){const vw=VW/Z,vh=(VH-TOP)/Z,pad=40;

function mKids(a,b){const an=a.childNodes,bn=[...b.childNodes];
  for(let i=0;i<bn.length;i++){const o=an[i],n=bn[i];if(!o){a.appendChild(n);continue;}
    if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName){a.replaceChild(n,o);continue;}
    if(o.nodeType!==1){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;continue;}
    for(const at of [...o.attributes])if(!n.hasAttribute(at.name))o.removeAttribute(at.name);
    for(const at of n.attributes)if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);

const ciReady=()=>G.c5.day!==dayKey()&&!!c5Rw(G.c5.n);
const GTI='<img class="tki" src="img/gticket.webp">';
function rwHtml(r){const a=[];if(r.m)a.push('💰 '+fmt(ciMoney(r.m)));if(r.money)a.push('💰 '+fmt(r.money));if(r.tk)a.push(TKI+' ×'+r.tk);if(r.ct)a.push(CTI+' ×'+r.ct);if(r.gt)a.push(GTI+' ×'+r.gt);if(r.dm)a.push(DMI+' ×'+r.dm);if(r.vipTo)a.push('👑 VIP '+r.vipTo);if(r.heroes)a.push('🔴 '+r.heroes.length+' Mythic heroes');if(r.ascSet)a.push('✦ Ascended gear set ×'+Object.keys(r.ascSet).length);return a.join('<br>');}
function giveRw(r){let m=0;if(r.m)m+=ciMoney(r.m);if(r.money)m+=r.money;if(m)G.money+=m;if(r.tk)G.h.tk+=r.tk;if(r.ct)G.h.ct+=r.ct;if(r.gt){G.gear.tk=(G.gear.tk==null?10:G.gear.tk)+r.gt;}if(r.dm)G.dm=(G.dm||0)+r.dm;if(r.ess)G.ess=(G.ess||0)+r.ess;if(r.gp)G.gp=(G.gp||0)+r.gp;if(r.pk){['tank','warrior','ranger','mage','support'].forEach(k=>pkAdd(k,r.pk.r||0));pkAdd('bk',r.pk.bk||0);}if(r.vipTo){G.vip=Math.max(G.vip||0,VIP_PTS[Math.min(VIP_MAX,r.vipTo)]);vipRefresh();if(G.vipC==null||G.vipC<VLV)G.vipC=VLV;}if(r.heroes){r.heroes.forEach(id=>{if(HB[id]&&!G.h.own[id])gain(id);});try{heroRefresh();}catch(e){}}if(r.ascSet&&window.CAMPAIGN&&CAMPAIGN.giftAsc)for(const hid in r.ascSet)CAMPAIGN.giftAsc(hid,r.ascSet[hid]);return m;}

const NEWS=[
 {id:133,d:'Nov 24, 2026',ic:'🎒',t:'Bigger gear bag + Shop',l:['Your gear bag now holds <b>200</b> items (was 150).','Shop: the Dungeon Pass is now in the <b>VIP PASS</b> tab. Forever packs are no longer sold – if you bought one, you keep it.']},
 {id:132,d:'Nov 24, 2026',ic:'✨',t:'New top bar',l:['A brand new <b>top bar</b> in one piece: your <b>avatar + frame</b>, your <b>NAME</b>, your <b>VIP badge</b> and your <b>TITLE</b> are now always visible.','Bigger numbers for money, diamonds, REP and cars sold.','Tap your <b>name</b> or the ✏️ → <b>change your name</b>. Tap your avatar or title → <b>your profile</b>. Tap the VIP badge → <b>VIP</b>.']},
 {id:131,d:'Nov 24, 2026',ic:'📅',t:'Check-in: 20 of each!',l:['<b>5000 FREE SUMMONS</b> now gives <b>20 Recruit + 20 Crew + 20 Gear</b> tickets every day (was 10) – you get all 5000 much faster.']},
 {id:130,d:'Nov 24, 2026',ic:'🔧',t:'Slot upgrades',l:['Gear upgrades <b>+1 … +50</b> now stay on the hero\'s <b>SLOT</b>: swap the piece and the <b>+</b> stays.','A badge in the corner of each slot shows its level – a new colour every <b>+5</b>.','Upgrades of pieces in the bag were refunded 100% in Gear Parts. Rebirth also gives back the slot upgrades.']},
 {id:129,d:'Nov 24, 2026',ic:'👑',t:'New VIP 1-10 + bigger packs',l:['Every purchase gives <b>VIP points</b> (1 € = 10). VIP 10 = 10,000 €. Daily Quests give 1 point each.','Every new VIP level opens a <b>big chest</b>: diamonds, lots of summon tickets and a <b>FULL GEAR SET of your choice</b> (Epic → Mythic, VIP 10 = Ascended) + Legendary heroes at VIP 4 and 8. <b>VIP 10</b>: a Mythic hero of your choice.','Every VIP level: <b>+1 h Idle</b> and <b>+10%</b> on all Idle Rewards.','Shop: bigger packs now give <b>more per €</b>. Diamond Pass: +5 Recruit +3 Gear tickets every day.','Your VIP level stayed the same.']},
 {id:128,d:'Nov 24, 2026',ic:'💎',t:'Diamond bonus + SWEEP',l:['Diamond packs in the Shop: your <b>1st</b> purchase of each pack gives <b>×3</b>, the <b>2nd</b> gives <b>×2</b>.','Campaign <b>SWEEP</b> (VIP 4+): up to <b>5 a day</b> – the counter is on the button.']},
 {id:127,d:'Nov 24, 2026',ic:'🛠',t:'Summon fix',l:['Fixed: after a summon the result cards stayed <b>invisible</b>. Your heroes, crew and gear now show up again.']},
 {id:126,d:'Nov 24, 2026',ic:'🚂',t:'Rail Wars guide',l:['The first time you open <b>RAIL WARS</b>, Mama Rosa explains how the train, the Street Tokens and the attacks work.']},
 {id:125,d:'Nov 24, 2026',ic:'🎉',t:'New EVENTS page',l:['Tap <b>EVENTS</b>: every event that is running now has its <b>own banner</b> – Torque Grand Prix and the 2 time events.','Tap a banner to open that event\'s page. ↩ brings you back to all events.','The <b>📅 EVENT CALENDAR</b> is right under the banners: the next events with their exact dates.']},
 {id:124,d:'Nov 23, 2026',ic:'👤',t:'Your avatar in the top bar',l:['Your <b>avatar with your frame</b> is now at the top left, next to your money.','Tap it to open <b>MY PROFILE</b> (name, icon, frame, title, graphics, help) – the PROFILE tab left the online pages.']},
 {id:123,d:'Nov 23, 2026',ic:'🆘',t:'HELP & SUPPORT in the game',l:['Found a bug, a problem with a purchase or your account? Tap <b>your avatar</b> (top left) → <b>HELP &amp; SUPPORT</b> (or MAIL → Need help?).','Choose what it is about, write a few words and tap <b>SEND</b> – the answer comes in your <b>MAIL</b>.','Chat: 3 seconds between messages – if you tap SEND sooner, your message waits and goes out by itself.']},
 {id:122,d:'Nov 23, 2026',ic:'📱',t:'AUTO graphics – the game checks your phone',l:['At the first start the game now <b>checks your phone</b> by itself: good phones get <b>HD</b>, normal phones <b>STANDARD</b>, older phones <b>LOW</b> – a lighter picture, so no lag.','If battles get slow, AUTO goes one step lower by itself next time.','You can still choose in <b>PROFILE → GRAPHICS</b>: AUTO · HD · STANDARD · LOW.']},
 {id:121,d:'Nov 23, 2026',ic:'🚨',t:'THIEVES 2.0 – gangs, bosses & K9 dogs',l:['Thieves now come <b>in groups</b>: amateurs, fast <b>★ PROs</b> and the <b>👑 GANG BOSS</b> with his van full of helpers. Sometimes the <b>whole GANG</b> attacks at once – a <b>GANG RAID</b>!','Your guards <b>patrol</b> all the time and fight like crazy. With 2+ thieves a <b>security car brings BACKUP</b> guards, and in big raids the <b>K9 van</b> drops a dog handler with his dogs.','Caught thieves give <b>Builder Kit</b>, <b>Crew Tickets</b> and <b>diamonds</b>. A thief who escapes steals <b>5–20% of your cash</b> – higher Security = less.','New <b>MOST WANTED</b> board in SECURITY: 3 wanted thieves every day, each with a bounty – catch all 3 for a daily bonus.']},
 {id:120,d:'Nov 23, 2026',ic:'🛡️',t:'Skills look like the hero\'s own art',l:['Hero skills now show only the hero\'s <b>own effect pictures</b> – the extra drawn circles, flashes and rings are gone (Epic, Legendary and Mythic heroes).','<b>Goliath – IRON FORTRESS</b>: every hero he protects now carries a small copy of <b>his golden shield</b> while the shield lasts. Ignis brings fallen heroes back with <b>his phoenix</b>.']},
 {id:119,d:'Nov 23, 2026',ic:'⚔️',t:'Heroes don\'t stand still anymore',l:['After a boss pushes them back, heroes sometimes stood still and did not attack. Now a hero who can\'t reach his place attacks from where he is (if the enemy is close) or picks a new place right away.']},
 {id:118,d:'Nov 23, 2026',ic:'👆',t:'Animated buttons',l:['Every button now <b>reacts to your finger</b>: it squeezes when you press, bounces back when you let go, and a small golden spark shows where you tapped.']},
 {id:117,d:'Nov 23, 2026',ic:'✨',t:'Heroes in HD',l:['On the hero page the hero in the middle is now drawn in <b>HD</b> (Epic, Legendary and Mythic heroes) – much sharper on big screens.']},
 {id:116,d:'Nov 23, 2026',ic:'🔨',t:'Salvage gives Essence too',l:['<b>SALVAGE</b> (by hand and AUTO SALVAGE) now also gives some hero <b>ESSENCE</b> – the higher the grade, the more Essence: Common 2% · Uncommon 4% · Rare 8% · Epic 15% · Legendary 30% · Mythic 60% · Ascended 120% of the Essence of one stage.']},
 {id:115,d:'Nov 23, 2026',ic:'⚙️',t:'Smarter AUTO EQUIP',l:['<b>AUTO EQUIP</b> now puts the hero\'s <b>own class set</b> first – the <b>highest grade</b> first (then level / stars). If all class pieces of one grade give more Power (×1.5), it picks those.','It can also <b>take a class piece from another hero</b> who does not get its set bonus – the window shows it (⚠️) and asks before anything changes. That hero gets the best free piece from the bag instead.']},
 {id:114,d:'Nov 23, 2026',ic:'👑',t:'Grand Prix Road: one lane per pass',l:['On the <b>Grand Prix Road</b> every pass now has <b>its own lane</b>: FREE · SILVER ×1 · GOLD ×2 · PLATINUM ×3 · 💎 DIAMOND PASS.','Rewards you already claimed stay claimed – nothing is lost.']},
 {id:113,d:'Nov 23, 2026',ic:'🏭',t:'Mythic heroes: one workshop each',l:['<b>Mythic heroes</b> now work only in the workshop of their class (like every other hero): Torque King – Electronics · Lady Overdrive – Tuning · Ignis – Service · Goliath – Engine Shop · Nova & Vega – Inspection · Chroma – Body & Paint.','A Mythic hero that was in another workshop went back to the bench – put him in his own workshop again.','The set glow now shines in the <b>grade color</b> of the piece.']},
 {id:112,d:'Nov 23, 2026',ic:'🛡️',t:'All gear is SET gear now',l:['<b>Every gear piece</b> (Common → Ascended, from every source) now belongs to one of the <b>6 class sets</b> – all sets have the same chance. Your old pieces got a random set.','Every set piece has its own random <b>SET STAT</b>: Common +2% · Uncommon +3% · Rare +4% · Epic +6% · Legendary +8% · Mythic +10% · Ascended +12%. All set pieces on a hero the <b>same grade</b> → <b>×1.5</b>!','The Legend class is gone: <b>Mythic heroes</b> now belong to the class of their role – Torque King: Electrical · Lady Overdrive: Tuning · Ignis: Service · Goliath: Engine · Nova & Vega: Inspection · Chroma: Paint.','Heroes are stronger now, so <b>all monsters are +30%</b>. The set glow is faster and brighter.']},
 {id:111,d:'Nov 23, 2026',ic:'🌋',t:'New battle backgrounds',l:['Campaign battles now have <b>7 new painted worlds</b>: Junkyard, Desert Highway, Car Factory, Frozen Pass, Neon City, Volcano Forge and the <b>Boss Arena</b> for every chapter boss.','Each world is alive: welding sparks, steam, neon lights, aurora, lava embers and lightning.','Later acts give the same worlds new colours.']},
 {id:110,d:'Nov 23, 2026',ic:'🎨',t:'New MYTHIC hero: Chroma, the Paint Tempest',l:['A new <b>MYTHIC MAGE</b> joins the Hero Summon: <b>Chroma, the Paint Tempest</b> – she fights from far away with her spray-gun staff.','Skill <b>RAINBOW TEMPEST</b>: a tornado of magic paint falls on the biggest group – 260% damage, slow for 4s, and the painted enemies deal −30% damage for 5s.','Talent <b>WET PAINT</b> (Lv 320 / 360 / 400): every monster she hits loses 20 / 25 / 30% attack speed for 4s.']},
 {id:109,d:'Nov 23, 2026',ic:'✨',t:'Set gear: glow + bigger class icon',l:['The <b>class icon</b> on set gear is now much bigger – easy to see which hero it is for.','A set piece on a hero of the <b>right class</b> glows all the time and shows a green <b>✓</b>. On the wrong class you see a red <b>✕</b> (no set bonus).','In the BAG, set pieces that fit the hero you selected glow too.']},
 {id:108,d:'Nov 23, 2026',ic:'👑',t:'VIP: bigger gifts on every level',l:['The <b>DAILY VIP GIFT</b> now grows with every level: VIP 1 = '+'Recruit tickets + diamonds · VIP 2 + <b>Crew tickets</b> · VIP 3 + <b>Gear tickets</b> · VIP 4 + <b>Essence</b> · VIP 5 + <b>Builder Kit</b> · VIP 8-10 + <b>Dungeon keys</b>.','VIP 10 every day: 10 Recruit · 5 Crew · 5 Gear tickets · <b>200 diamonds</b> · Essence · Builder Kit · 1 key in every dungeon.','<b>World Boss</b>: +1 key a day at VIP 7, +2 at VIP 10.','VIP bonuses now boost <b>Idle Essence, Gear Parts and garage parts</b> (instead of garage money). The weekly chest now really gives 1 key in every dungeon.','<b>Daily Quests</b> now have battle quests too (campaign, towers, Dungeons, Arena, World Boss).']},
 {id:107,d:'Nov 23, 2026',ic:'💎',t:'AUTO SUMMON with diamonds',l:['<b>⚡ AUTO SUMMON</b> can now use <b>diamonds</b> too: choose NO, <b>10K</b>, <b>50K</b> or <b>ALL</b> in its window.','Tickets are always used first, then diamonds (100 = 1 summon) – never more than the limit you chose.']},
 {id:106,d:'Nov 23, 2026',ic:'⚡',t:'AUTO SUMMON',l:['New green <b>⚡ AUTO SUMMON</b> button on the HERO, CREW and GEAR summon pages.','It summons <b>×10</b> again and again with your <b>tickets only</b> – diamonds are never used.','Choose when it stops: first <b>Legendary</b>, first <b>Mythic</b> or <b>all tickets</b>. Tap <b>■ STOP</b> any time.','At the end you see how many of each grade you got and your best results.']},
 {id:105,d:'Nov 23, 2026',ic:'👹',t:'Smarter monsters: MINI BOSS + ENRAGE',l:['Every battle now compares your <b>POWER</b> with the monsters\' power.','Monsters more than <b>×1.3</b> stronger: a <b>MINI BOSS</b> joins the last wave. More than <b>×2</b>: they go <b>ENRAGE</b> too.','Your team stronger? Nothing changes. Beating a mini boss gives bonus <b>Essence</b>.','Campaign, Torque Tower and Class Towers only. Hero armor (DEF) now blocks at most 60% of a hit, so POWER shows your real strength.','In the campaign it starts at <b>chapter 5</b> (stage 5-1) – the team screen warns you before the fight (⚠ MINI BOSS / ENRAGE).']},
 {id:104,d:'Nov 23, 2026',ic:'💎',t:'Diamond Pass: your diamonds come back',l:['<b>Tier 1</b> of the DIAMOND PASS lane now gives back <b>ALL the diamonds</b> you paid (PASS 2,500 · PASS+ 6,000 · upgrade: the 3,500 difference).','Tiers 2-100 give the rest of the rewards as before. Already claimed tier 1 before? Open the Grand Prix – your diamonds come back automatically.']},
 {id:103,d:'Nov 23, 2026',ic:'💎',t:'Grand Prix SHOP tab, DIAMOND PASS+ & bigger Campaign Funds',l:['The <b>GP SHOP</b> has its own tab now – spend your GP Tokens there.','New <b>DIAMOND PASS+</b> (💎6,000, ×0.8 lane). Already have the Diamond Pass? Upgrade for only the difference.','<b>Campaign Funds</b> give more: NORMAL 17,000 💎 (was 11,200) + Gear Tickets, HARD 25,000 💎 (was 16,700) + more tickets.']},
 {id:102,d:'Nov 23, 2026',ic:'⚔️',t:'Arena: straight from BATTLE',l:['Tap <b>BATTLE</b> → <b>ARENA</b>: the Arena now opens as its own page – no chat bar.','✕ brings you back to the Battle Hub. The Torque Cup works the same way.']},
 {id:101,d:'Nov 23, 2026',ic:'💎',t:'Grand Prix: DIAMOND PASS',l:['New blue lane on the Grand Prix Road: the <b>DIAMOND PASS</b>, bought with <b>2,500 diamonds</b> – no real money.','Every tier you reach gives a bonus: tickets, keys, Essence and Builder Kits (×0.5 of the free lane, no diamonds back).','New badges for the Grand Prix <b>TOP 10</b>: GP CHAMPION, GP PODIUM and GP FINISHER.']},
 {id:100,d:'Nov 23, 2026',ic:'🏁',t:'Grand Prix: 100 tiers, no time limit, TOP 10 race',l:['The Grand Prix Road now has <b>100 tiers</b> (tiers 51-99 give ×1.5, tier 100 = a big final prize). Tier 50 is still a <b>MYTHIC of your choice</b>.','New <b>CHAMPION missions</b> open every week – week 2, 3 and 4. The last one: own a <b>MYTHIC AWAKENED I</b>.','<b>No time limit</b>: the event stays open until 10 players finish ALL event missions. Then 7 more days for everybody to claim the Road.','<b>TOP 10</b> (first come, first served): #1 <b>GP CHAMPION</b> + gold name · #2-3 <b>GP PODIUM</b> + silver name · #4-10 <b>GP FINISHER</b> + purple name, plus diamonds and tickets.']},
 {id:99,d:'Nov 23, 2026',ic:'🔴',t:'Red dots show the way',l:['A red dot now <b>says what to do</b>: <b>LV UP</b>, <b>GEAR</b>, <b>SWAP</b>, <b>GIFT</b>, ticket counts …','Follow the dots: every page shows the next dot until the exact hero, button or reward.','The <b>❗</b> is only for <b>Dungeons</b> (keys waiting).']},
 {id:98,d:'Nov 23, 2026',ic:'👑',t:'Grand Prix Packs now STACK',l:['Every Grand Prix Pack you buy now <b>adds up</b>: Silver ×1 + Gold ×2 + Platinum ×3 = PREMIUM lane up to <b>×6</b> (before, only your best pack counted).','Bought a new pack after claiming? The Premium tiers you already took give you the <b>difference</b> – tap CLAIM ALL PREMIUM.','Gold or Platinum still give the ✦ Ascended gear and Platinum the extra Mythic copy at tier 50 (only once).']},
 {id:97,d:'Nov 23, 2026',ic:'🔥',t:'Server announcements & red ❗',l:['When a player gets a <b style="color:#ff5a3c">MYTHIC</b> hero, the <b>whole server</b> sees it: a big golden banner on top of the screen for a few seconds (not in the chat).','The same for <b style="color:#2ef3ff">ASCENDED</b> gear – from Gear Summon, campaign, Dungeons, Class Towers or Idle Rewards.','A red <b style="color:#ff1744">❗</b> now shows everywhere there is something to do: BATTLE (World Boss keys / rewards, Dungeon keys, Arena fights), ARENA, VIP gifts, Heroes, Summon, Crew, Idle, Quests, Events, Check-in, News, Mail and Chat.']},
 {id:96,d:'Nov 23, 2026',ic:'⭐',t:'GRADE BEATS PLUS',l:['A hero of a <b>higher grade at +0</b> is now always stronger than a hero of the grade below at its max: Uncommon +0 > Common +50 · Rare +0 > Uncommon +50 · Epic +0 > Rare +50 · Legendary +0 > Epic +50 · Mythic > Legendary +10.','Common → Epic: every + gives <b>+1.2%</b> (+50 = ×1.6). Legendary: every + gives <b>+9.5%</b> (+10 ≈ 2× an Epic +50).','Summon higher grades – they are worth it!']},
 {id:95,d:'Nov 23, 2026',ic:'👉',t:'SHORTCUTS & GO buttons',l:['<b>YOUR PARTS</b>: tap a part → the map flies to your <b>weakest building</b> that uses it and opens its upgrade. A green <b style="color:#43e97b">▲</b> = you can upgrade one right now.','<b>GO</b> on every <b>Grand Prix</b> mission takes you straight to the place where it is done (campaign, summon, Dungeons, towers, heroes, Idle…). Close that page and you are back in the Grand Prix.','<b>Daily Quests</b> (tap the picture) and the <b>event quests</b> have GO too.']},
 {id:94,d:'Nov 23, 2026',ic:'🏅',t:'ARENA SHOP + ARENA REWARDS',l:['New Arena currency: <b>ARENA MEDALS</b> – <b>+10</b> for a win, <b>+3</b> for a loss, more with the daily reward (20 → 100 by league) and at the end of the season (100 → 1,000).','<b>ARENA SHOP</b> (tab SHOP): Recruit / Gear / Crew tickets, Dungeon keys, Essence, Builder Kits – weekly limits. A <b>Legendary hero of your choice</b> once a month, the <b>Gladiator frame</b> and the title <b>ARENA WARLORD</b>.','<b>ARENA REWARDS</b> (tab REWARDS): 7 chests at 3 · 7 · 12 · 20 · 30 · 45 · 60 wins, every season.']},
 {id:93,d:'Nov 23, 2026',ic:'🔥',t:'MYTHIC TALENTS',l:['Every <b>Mythic</b> hero has his own <b>TALENT</b>, unlocked in 3 phases on the way to Lv 400: <b>I at Lv 320 · II at Lv 360 · III at Lv 400</b>.','<b>The Torque King</b> – Overload Crown (lightning jumps to 2 more monsters) · <b>Lady Overdrive</b> – Redline Rush (+attack speed at the start of every wave) · <b>Ignis</b> – Rebirth Flame (reborn once per battle).','<b>Goliath</b> – Iron Wall (shield for the whole team every wave) · <b>Nova</b> – Star Mark (her target takes more damage) · <b>Vega</b> – Piercing Rail (every 3rd shot goes through the line).','See it in the <b>LEVEL UP</b> window of a Mythic hero.']},
{id:92,d:'Nov 23, 2026',ic:'🔴',t:'MYTHIC CORE & Lv 400',l:['New rare currency: <b>Mythic Core</b>. A duplicate of a hero already at its max can give one: Common 0.02% · Uncommon 0.03% · Rare 0.05% · Epic 0.2% · Legendary 1% · a <b>Mythic duplicate always gives 50</b>.','<b>Mythic heroes</b> now go up to <b>Lv 400</b>: levels 301-400 and 5 <b>Core Ascensions</b> are paid in Mythic Core (+4% stats and +1 skill level each Core Ascension).','<b>CORE SHOP</b> (LEVEL UP window of a Mythic): the <b>RED MYTHIC BOX</b> – open it and choose any Mythic hero (new or +1 copy for Awakening). The box can never be salvaged.','The last stages and floors got stronger again to stay above the strongest team.']},
{id:91,d:'Nov 23, 2026',ic:'🛠',t:'Fix: heroes running on the spot',l:['Sometimes after coming back to the game in the middle of a fight, the heroes ran on the spot and never hit the monsters (thanks Wazza4ever!).','Now the battle checks itself: if nobody is hit for 6 seconds, every hero and monster is put back in place and the fight goes on.']},
{id:90,d:'Nov 23, 2026',ic:'⚙️',t:'Gear: ENHANCE +50',l:['<b>Common → Mythic</b> gear: no more stars – ENHANCE with Gear Parts up to <b>+50</b> (every grade).','Every <b>+5</b> unlocks a bonus: +5 … +40 = extra stats +5% each, <b>+45</b> = main stat ×1.4, <b>+50</b> = main stat ×2 in total.','<b style="color:#2ef3ff">ASCENDED</b>: no levels – a new Ascended is already <b>stronger than a Mythic +50</b>. Only Ascended get stars, <b>★1 to ★20</b>.','Your old pieces: stars became + levels (never weaker). Ascended levels became stars and the Gear Parts you spent on them came back.']},
{id:89,d:'Nov 23, 2026',ic:'💀',t:'Stronger endgame',l:['The last stages and floors are now <b>much stronger</b> – they follow the strongest heroes in the game.','Campaign stages after 1000, Torque Tower and Class Towers after floor 300 climb harder. Final stage 75-30: about <b>358 M</b> power (HARD about 717 M).','Everything before stage 1000 and floor 300 stays the same.']},
{id:88,d:'Nov 23, 2026',ic:'🗺️',t:'30 stages per chapter',l:['Every campaign chapter now has <b>30 stages</b> (was 20): mini-boss at stage 15, chapter boss at stage 30.','<b>2250 stages</b> in total – 750 new stages at the end, in NORMAL and HARD.','Your progress and your stars stay exactly the same – only the numbers changed (old stage 18-1 is now 12-11).','Mini-bosses and chapter bosses give <b>bigger rewards</b>, so you get the same tickets, diamonds, Essence and parts as before.','<b>Campaign Funds</b>: a reward every <b>3rd chapter</b> (was every 5th) – a bit sooner than before.']},
{id:87,d:'Nov 23, 2026',ic:'👹',t:'Bosses come alive',l:['The 5 <b>chapter bosses</b> now make a real <b>entrance</b> when they appear and get visibly <b>ENRAGED</b> (red glow, lightning) when their HP drops below 50%.','<b>7 new monsters</b> (Muffler Slug, Piston Beetle, Wrench Raptor, Oil Slime, Radiator Toad, Gear Hedgehog, Bumper Rhino) and <b>4 new chapter bosses</b> (Dozer Behemoth, Compactor Kraken, Fire Engine Hydra, Mixer Colossus) wait for you in Acts 11-15 (stages 1001-1500).']},
 {id:86,d:'Nov 23, 2026',ic:'👑',t:'Grand Prix PATRONS',l:['When a player buys a <b>Grand Prix Pack</b> he becomes a <b>Patron</b> – the whole server sees it in the chat.','<b>Everybody</b> on the server gets a gift: Silver 💎30 · Gold 💎60 · Platinum 💎100 + 2 Hero Tickets (max 💎300 + 6 tickets a day).','See all the Patrons of your server in <b>GRAND PRIX → PATRONS</b>.']},
 {id:85,d:'Nov 23, 2026',ic:'👑',t:'Grand Prix Packs are here',l:['Open <b>EVENTS → GRAND PRIX</b> → Shop: <b>SILVER</b> (€4.99), <b>GOLD</b> (€9.99) and <b>PLATINUM</b> (€19.99) – one-time packs for this one-time event.','They open the <b>PREMIUM lane</b> of the Grand Prix Road (rewards ×1 / ×2 / ×3) and give <b>+10% / +20% / +30% GP Tokens</b>. Tiers you already reached can be claimed right away.','Gold: an <b>Ascended</b> gear piece at tier 50 · Platinum: also <b>+1 copy of your Mythic</b>. Road points and the LEGENDS ranking stay the same for everyone.']},
 {id:84,d:'Nov 23, 2026',ic:'📅',t:'New Check-in page',l:['The <b>5000 FREE SUMMONS</b> page has a brand-new look: TODAY\'s rewards, a big <b>CLAIM</b> button and a progress bar to <b>5000</b> tickets.','Same rewards as before: <b>10 Recruit + 10 Crew + 10 Gear</b> tickets every day, nothing random. Missing a day never resets your progress.']},
 {id:83,d:'Nov 23, 2026',ic:'⚖️',t:'BALANCE UPDATE – a longer road to the top',l:['<b>MYTHIC heroes are much stronger</b>: a fresh Mythic is now as strong as a Legendary +10, and every AWAKENING gives more.','<b>Hero levels</b> cost more Essence (after Lv 10), but <b>every level gives twice the stats</b> and every ASCENSION (20 levels) gives a <b>big boost</b>.','<b>Garage upgrades</b> need more parts (after LV 2) – every level is a real goal now.','Duplicate heroes that are already maxed now give <b>diamonds</b>.','Campaign monsters and <b>Dungeons</b> are tougher, and <b>Mythic gear</b> is rarer – every Mythic drop is special.']},
 {id:82,d:'Nov 22, 2026',ic:'🏁',t:'TORQUE GRAND PRIX – a ONE-TIME event!',l:['A huge <b>28-day</b> event – it happens <b>only once</b> and never comes back. Open <b>EVENTS</b> → tap the <b>GRAND PRIX</b> banner.','Do <b>missions</b> (daily, weekly, event) → earn <b>GP Tokens</b> → climb the <b>Grand Prix Road</b> (50 tiers). <b>Tier 50 = a MYTHIC hero of your choice</b>, free!','Spend tokens in the <b>GP Shop</b>, take a free <b>Pit-Stop Chest</b> every week, fill the <b>SERVER GOAL</b> together (gifts for everyone).','<b>LEGENDS</b>: the TOP of your server wins prestige prizes – golden statue, trophy #1, animated frame … <b>FIRST OVER THE LINE</b>: the first 10 who finish the ULTIMATE mission win extra prizes.']},
 {id:81,d:'Nov 22, 2026',ic:'🔑',t:'Dungeons: 100 floors',l:['Every dungeon now has <b>100 floors</b> (was 30). Floors 1-30 stay the same.','After floor 30 the monsters get <b>much stronger</b> – floor 100 is for the strongest teams in the game.','Bigger rewards: <b style="color:#ff6b6b">MYTHIC</b> gear (Scrap Mine) and <b style="color:#ff6b6b">MYTHIC</b> set pieces (Gear Forge) from floor <b>61</b>, NITRO BOOST up to <b>+30%</b>, more cash, Essence and Gear Parts.','Boss floors <b>40, 50 … 100</b> give <b>×2</b> cash, Essence and Gear Parts.','The <b>DUNGEON MASTER</b> title (floor 50 in all 4 dungeons) can now be won.']},
 {id:80,d:'Nov 22, 2026',ic:'🔍',t:'See other players\' heroes',l:['Open a player\'s <b>profile</b> (Ranking, Chat, Arena) and <b>tap a hero</b> of the BATTLE TEAM.','You see the hero\'s <b>level</b>, <b>power</b>, HP / ATK / DEF / crit / speed, the <b>skill</b> and all <b>6 pieces of gear</b> (grade, level, stars).','The gear shows after that player opens the new version once.']},
 {id:79,d:'Nov 22, 2026',ic:'🛡️',t:'Mythic heroes: role sets count',l:['<b style="color:#ff6b6b">MYTHIC</b> heroes now get the set bonus from the <b>Torque King</b> set <b>OR</b> from the set of their <b>role</b> – the one with more pieces counts.','Goliath (TANK) → <b>Iron Piston</b> · Ignis (SUPPORT) → <b>Field Medic</b> · The Torque King (MAGE) → <b>Color Storm</b> / <b>Thunder Coil</b> · Lady Overdrive (WARRIOR) → <b>Nitro Rush</b> · Nova & Vega (RANGER) → <b>Laser Scope</b>.','<b>AUTO EQUIP</b> checks these sets too. Thanks Wazza4ever!']},
 {id:78,d:'Nov 22, 2026',ic:'🎒',t:'Full bag: no more lost gear',l:['Battles, towers and dungeons <b>never lose gear</b> any more when your bag is full: the bag can go <b>over its limit</b> (up to +150).','While the bag is over the limit, only <b>GEAR SUMMON</b> is locked – a window takes you straight to <b>SALVAGE</b>. The bag counter turns red.','Tip: <b>AUTO SALVAGE</b> (Salvage page) turns the low grades you choose into parts automatically. Thanks Wazza4ever for the idea!']},
 {id:77,d:'Nov 22, 2026',ic:'🌟',t:'AWAKENING, new pity, 500-floor towers & Dungeon Rush',l:['<b style="color:#ff6b6b">MYTHIC AWAKENING</b>: copies of a Mythic wake it up – <b>Awakened I → V</b> (9 copies): much more power and skill levels, a new portrait at Awakened V. Your old Mythic stars were turned into Awakening tiers (nobody gets weaker).','<b>Legendary</b> heroes now go to <b>+10</b> – every + after +5 is much stronger (a Legendary +10 ≈ 2× an Epic +50). Extra stars became 💎.','<b>PITY</b>: a <b>Legendary every 100</b> summons (was 500) and a new <b>MYTHIC pity</b>: Hero 1500 – you choose the Mythic with <b>WISH</b> – Gear 750.','<b>MYTHIC +15%</b> and <b>ASCENDED gear +20%</b>. The <b>HERO COLLECTION</b> bonuses are stronger and the new <b>★ STAR COLLECTION</b> gives bonuses when all heroes of a color reach a step.','<b>TORQUE TOWER</b> and every <b>CLASS TOWER</b> now have <b>500 floors</b> – bigger rewards the higher you climb, Mythic set pieces and a full <b>ASCENDED SET</b> at the top of the Class Towers.','New event <b>DUNGEON RUSH</b> and the <b>📅 EVENT CALENDAR</b> with the exact dates of the next events.','<b>SALVAGE</b>: tap the grades to choose them (now saved), <b>SALVAGE ALL</b> takes every piece of those grades and the new <b>AUTO SALVAGE</b> recycles new drops of those grades by itself (set pieces never).','<b>IDLE REWARDS</b>: 6 h instead of 4 h and +30% money while you are away.','Every stage and tower is a bit stronger to match the new hero power (Dungeons only a little).']},
 {id:76,d:'Nov 22, 2026',ic:'✨',t:'NEW: HD graphics',l:['Tap the new <b>HD</b> button (above the zoom buttons) or <b>PROFILE → GRAPHICS</b>: choose <b>AUTO</b> (best for every phone) or <b>HD</b> – the sharpest picture on good phones, in battles and on the garage map.','<b>HERO COLLECTION</b>: heroes you don\'t have yet are shown in grey – tap one to see its page (skills, stats at Lv 1).','HD never lowers the quality by itself. It uses a bit more battery and memory – if the game gets slow, go back to AUTO.']},
 {id:75,d:'Nov 22, 2026',ic:'🔑',t:'Dungeon keys stack up + Legendary heroes in the packs',l:['<b>DUNGEONS</b>: daily keys you do not use are now <b>kept</b> – they stack up day after day (also on the days you do not play, up to 30 days).','The <b>STARTER PACK</b> now gives <b>Mama Rosa</b> and the <b>ROOKIE PACK</b> gives <b>Sofia Lightning</b> – both <b>LEGENDARY</b> heroes.','New short guides the first time you open the building upgrades, Dungeons, Team Roles and the Classic Collection.']},
 {id:74,d:'Nov 21, 2026',ic:'🚆',t:'NEW: RAIL WARS + Rail Terminal',l:['Build the <b>RAIL TERMINAL</b> next to your Car Factory. Every hour the factory makes <b>EXPORT cars</b>: they fuel at the Gas Station, get washed at the Car Wash and go up on your train.','A full train is sent from the <b>RAIL WARS</b> page (RAIL WARS button on the right side of the screen): <b>3 trains a day</b>, 30 min on the way. Its <b>GRADE</b> (Common → Mythic) depends on your Car Wash, Gas Station and Car Factory levels – you can refresh it <b>2 times</b>.','Other players can <b>ATTACK</b> your train (a fight like the Arena) and steal <b>20%</b> of it – a train can be robbed 2 times. You have <b>5 attacks a day</b> too!','Your trains bring <b>STREET TOKENS</b> – spend them in the <b>STREET SHOP</b>: every ticket and every Dungeon key for 500.']},
 {id:73,d:'Nov 21, 2026',ic:'🏹',t:'2 new MYTHIC heroes: Nova & Vega',l:['Two new <b>MYTHIC RANGERS</b> join the Hero Summon – the first Mythic heroes who fight from far away.','<b>Nova, the Starfire Huntress</b> – skill <b>STARFIRE RAIN</b>: a rain of electric spark-plug arrows: 240% damage, slow and +35% damage taken for 6s.','<b>Vega, the Railgun Ace</b> – skill <b>OVERDRIVE RAILSHOT</b>: his hawk drone marks the strongest enemy, then a giant railgun beam: 550% damage (always critical) and 160% to every enemy in its lane.','With 6 Mythic heroes you can now build a full Mythic team with all 5 roles.']},
 {id:71,d:'Nov 21, 2026',ic:'👾',t:'5 new monsters',l:['New enemies built from car parts: <b>Spring Hopper</b> (jumps on you), <b>Caliper Crab</b> (hard shell), <b>Jack Scorpion</b> (stinger strike), <b>Filter Goblin</b> (throws oil bombs) and <b>Mirror Moth</b> (flying, mirror glare).','You meet them in the Campaign (one in each world), in Torque Tower and in Dungeons.','<b>NEW: 5 NEW ACTS</b> – NEMESIS, APEX, ECLIPSE, CHAOS and LEGEND: 25 new chapters (51-75), <b>500 new stages</b> in NORMAL and HARD – 1500 stages in total. Every zone has the new monsters and a new final boss waits at 75-20: the <b>LEGEND ENGINE</b>.']},
 {id:70,d:'Nov 21, 2026',ic:'🔥',t:'HARD MODE monsters are on fire',l:['In the <b>HARD</b> campaign the monsters now stand in a <b>ring of fire</b>, burn with <b>flames</b> behind them and glow with heat.','They are also <b>10% bigger</b> – you can see at a glance that this is HARD MODE.']},
 {id:69,d:'Nov 21, 2026',ic:'🧩',t:'TEAM ROLES bonus is ON',l:['Your battle team now gets a bonus for <b>different roles</b> (TANK, WARRIOR, RANGER, MAGE, SUPPORT): 3 roles <b>+5%</b> · 4 roles <b>+10%</b> · all 5 roles <b>+15%</b> attack &amp; HP.','It works in every battle and in the Arena. See it on the HEROES page under BATTLE TEAM (lit role icons + the bonus).','A mixed team (a tank in front, a support that heals, mage / ranger for damage) is now better than 5 heroes of the same role.']},
 {id:68,d:'Nov 21, 2026',ic:'⚔️',t:'Bigger power gaps between hero grades',l:['Each hero grade is now about <b>×1.4 stronger</b> than the one below: Uncommon ×1.4 · Rare ×1.95 · Epic ×2.75 · Legendary ×4.1 · Mythic ×5.6 (compared to Common, same level).','A Legendary now clearly beats an Epic, and a Mythic clearly beats a Legendary – you will feel it most in the <b>Arena</b>.','Monsters were adjusted so the campaign stays as hard as before for a normal team.']},
 {id:67,d:'Nov 21, 2026',ic:'🐉',t:'WORLD BOSS: all 4 bosses fully animated',l:['<b>SCRAPZILLA, CRUSHER KING, INFERNO PISTON</b> and <b>TOW SERPENT</b> have brand-new animations: intro, idle, attacks, skill, hit and ENRAGE.','New skill effects: Scrapzilla\'s <b>fire breath</b>, Crusher King\'s <b>shockwave</b>, Inferno Piston\'s <b>lava wave</b> and Tow Serpent\'s <b>chain hook</b>.','In the last 20 seconds the boss turns red and stays <b>ENRAGED</b>. Damage and rewards are unchanged.']},
 {id:66,d:'Nov 21, 2026',ic:'♻️',t:'New: hero REBIRTH',l:['On the hero page, in the <b>LEVEL UP</b> window, there is a new red button <b>♻ REBIRTH</b>.','The hero goes back to <b>Lv 1</b> with no Ascension, and you get back <b>100% of the Essence</b> you spent on him. His gear goes back to the BAG (upgrades and stars stay on the pieces). Free, any time.','Stars (+copies) stay. Use the Essence on any other hero.']},
 {id:65,d:'Nov 21, 2026',ic:'🛡️',t:'New MYTHIC hero: Goliath, the Iron Bulwark',l:['A fourth <b>MYTHIC</b> hero joins the Hero Summon: <b>Goliath, the Iron Bulwark</b> – the first Mythic <b>TANK</b>, a giant mechanic with a truck-grille shield and a piston hammer.','Skill <b>IRON FORTRESS</b>: a giant energy shield crashes on the enemies – 180% damage and stun 1.5s. Goliath pulls ALL enemies on him for 6s with a shield of 60% HP; all your mechanics get a shield of 25% HP and take −20% damage for 6s.','The Mythic chance in the Hero Summon stays the same (0.08%) – it is now shared by 4 Mythic heroes.']},
 {id:64,d:'Nov 21, 2026',ic:'🔧',t:'Garages: upgrade with PARTS · Level 100 · Classic Collection · Cash Roulette',l:['Buildings are now upgraded with <b>PARTS</b>, not money. Battle garages use the parts of their role: Engine = <b>Tank</b>, Tuning = <b>Warrior</b>, Inspection = <b>Ranger</b>, Paint + Electronics = <b>Mage</b>, Service = <b>Support</b>. All other buildings use the <b>Builder Kit</b>. You got a gift of parts to start.','Parts come from <b>salvaging gear</b>, <b>Idle Rewards</b>, <b>campaign stages</b>, <b>Class Towers</b> (their role), <b>Torque Tower</b> (Builder Kit), the Cash Roulette and packs.','Buildings now go up to <b>LEVEL 100</b>. Every battle garage makes its hero class stronger in battle: up to <b>+100% ATK &amp; HP</b> at LV 100.','<b>Classic Collection</b>: 36 cars now (up to billions), no parking limit – every car gives <b>ALL heroes +ATK &amp; HP</b> and free tickets every hour. Your money now has a big goal!','New event <b>CASH ROULETTE</b>: spend your cash on spins (max 25 per event, each spin costs more) – win garage parts and Dungeon keys.','Every hero now shows its battle <b>ROLE</b>: Tank, Warrior, Ranger, Mage or Support.']},
 {id:63,d:'Nov 21, 2026',ic:'🔥',t:'New MYTHIC hero: Ignis, the Iron Phoenix',l:['A third <b>MYTHIC</b> hero joins the Hero Summon: <b>Ignis, the Iron Phoenix</b> – a phoenix-mechanic with burning metal wings and a flaming phoenix staff.','Skill <b>REBIRTH FLAME</b>: a giant fire phoenix dives on the enemies – 200% damage to all, they burn. Heals all your mechanics 35% + 15% over 4s, team −20% damage taken. <b>Once per battle it brings back ALL fallen mechanics</b> with 40% HP.','The Mythic chance in the Hero Summon stays the same (0.08%) – it is now shared by 3 Mythic heroes.']},
 {id:62,d:'Nov 21, 2026',ic:'🚀',t:'Nina, Viktor, Big Mo: new animations',l:['<b>Nina</b>, <b>Viktor</b> and <b>Big Mo</b> (Epic) have new smooth animations in battle: idle, run, attack, skill, victory and KO. Now every Epic, Legendary and Mythic hero has them.','<b>NITRO ROCKET</b> (Nina): her checkered rocket explodes on the biggest group in her lane.','<b>ENGINE DROP</b> (Viktor): he throws a whole engine block from where he stands – it falls on the biggest group.','<b>TOOLBOX FORTRESS</b> (Big Mo): a healing dome rises under every mechanic.','Same numbers as before.']},
 {id:61,d:'Nov 21, 2026',ic:'👑',t:'New VIP: 10 levels, gifts and badges',l:['VIP now has <b>10 levels</b> (before 20) – every level counts double and VIP 10 gives what VIP 20 gave. Your VIP points stay the same.','Every <b>new VIP level</b> opens a chest: diamonds + tickets, a <b>Legendary</b> hero at VIP 5 and a <b>Mythic</b> hero at VIP 10.','VIP page: <b>free summons + diamonds every day</b> and a <b>weekly chest</b> every Monday.','New VIP perks: <b>Quick Idle</b> (2 h at once), <b>SWEEP</b> in campaign and Dungeons (VIP 4), bigger gear bag, more Arena fights and Dungeon keys.','New <b>VIP badges</b> in chat, rankings and profile – and a <b>HIDE VIP</b> button on your profile.','Every purchase now also gives VIP points.']},
 {id:60,d:'Nov 21, 2026',ic:'💡',t:'Easier to understand',l:['<b>Finish the tutorial</b> for a big gift: <b>1000 diamonds</b> + <b>10 Recruit, 10 Crew and 10 Gear Tickets</b>.','Mama Rosa now explains every page the first time you open it (Heroes, Gear, My Crew, Summon, VIP, Events, Check-in).','Tap the <b>diamonds</b> (top bar) or the <b>Essence / Gear Parts</b> on the HEROES page: one window explains every resource – where to get it and what it is for.']},
 {id:59,d:'Nov 21, 2026',ic:'✦',t:'Ascended gear: drops only',l:['<b>Ascended</b> gear can no longer be made from a Mythic ★5.','It now <b>drops</b> from: <b>Gear Summon</b> (0.02%), <b>campaign battles</b> from chapter 30 and <b>Idle Rewards</b> from chapter 30 (a small chance for every hour in the chest).']},
 {id:58,d:'Nov 21, 2026',ic:'💰',t:'See your income + faster towers',l:['<b>Income per hour</b>: under your money you now see how much your garage earns per hour. Tap it for every building.','Every building shows <b>💰 Income now → after the upgrade</b>, so you know what is worth upgrading.','Heroes in buildings now show their bonus (⚡ speed · 💵 pay). Wrong class = no bonus – now you can see it.','<b>Towers</b>: AUTO NEXT like the campaign – the next floor starts after 3 s.','<b>Battle Speed pack</b>: now <b>×3</b> (was ×2). Already bought? You have ×3 now.','<b>Classic Collection</b>: the cars now give <b>Essence + Gear Parts</b> for your heroes and fewer diamonds.','New buttons open step by step for new players (News, Crew, VIP, Rank, Events, Chat). Arena and Torque Cup open after stage 1-20.','Less memory: the map loads only the pictures you need – smoother on small phones.','Chapter bosses are a bit weaker (Omega Engine 5-20 was much too strong).']},
 {id:57,d:'Nov 20, 2026',ic:'🛠',t:'Big bug check – every page',l:['A robot tapped every button of every page (about 1,500 taps) to find hidden bugs.','Fixed: <b>SEE MY CREW</b> and the <b>Use Diamonds?</b> window opened behind the HEROES / Summon page.','Fixed: <b>GEAR BAG</b> on the Summon page now opens the bag (it opened the HEROES page).','Fixed: two ✕ buttons on top of each other in the gear window, the ticket number in My Crew going out of the screen, hero ART a bit too wide.']},
 {id:56,d:'Nov 20, 2026',ic:'↩',t:'Same buttons everywhere',l:['Every page now has the <b>same Back button</b> (top left) and every window the <b>same red ✕</b> – no more different styles.','Idle Rewards: the money per hour is shorter (<b>/h</b>) so it always fits.']},
  {id:55,d:'Nov 20, 2026',ic:'🔩',t:'See your Gear Parts',l:['The gear window now shows <b>how many Gear Parts you have</b> (top left), next to the UPGRADE cost.','Under UPGRADE: <b>Cost</b> · <b>You have</b> · and how many you still need.','The BAG page also shows your Gear Parts at the bottom.']},
 {id:54,d:'Nov 20, 2026',ic:'🎟',t:'Summon results fixed',l:['Fixed: when you summon heroes or crew from the <b>HEROES</b> / battle pages, the results were hidden behind the Summon page. Now they always show on top.']},
 {id:53,d:'Nov 20, 2026',ic:'🔤',t:'Cleaner texts everywhere',l:['<b>Hero page</b>: the hero is no longer hidden behind his name – shorter header, 🖼 ART moved to the top right corner.','Hero <b>stats</b> never get cut any more (big numbers as 1.67M).','Names and labels that were too long ("The Torque Ki…") now get a bit smaller letters and fit.','Big money shows as <b>$10.00B</b> / T (no more $10000.00M), diamonds as 1.00M.','Fixed: equal card sizes in My Crew, World Boss damage box, Dungeons texts, Events banner, Check-in title, gear names, summon badges, Shop tabs under the ✕, Mythic summon rate shown exactly (0.08%).']},
 {id:52,d:'Nov 20, 2026',ic:'🌀',t:'ARIA NEON – new animations',l:['<b>ARIA NEON</b> (Epic) has brand-new battle animations: idle, run, attack, skill, victory and knock-out.','Her skill <b>NEON SPIN</b>: she spins into a blur of neon light, dashes through her wide lane and a <b>neon tornado</b> bursts on the biggest group.','New <b>splash art</b>: tap 🖼 ART on her card.']},
 {id:51,d:'Nov 20, 2026',ic:'🛡️',t:'Simpler teams',l:['New <b>HEROES</b> button on the map (under BATTLE): your <b>one BATTLE TEAM</b> for every battle – campaign, Arena, Torque Tower, Dungeons, World Boss.','Tap a hero to see his <b>gear</b>, <b>LEVEL UP</b>, <b>skills</b> and to add him to the team or take him out.','No more EDIT TEAM before each battle – just tap FIGHT. Class Towers pick the heroes of their class automatically.','<b>CREW</b> = who works in the garages (not the battle team).']},
 {id:50,d:'Nov 20, 2026',ic:'🎯',t:'HAWK-EYE HUGO – new animations',l:['<b>HAWK-EYE HUGO</b> (Epic) has brand-new battle animations: idle, run, attack, skill, victory and knock-out.','His skill <b>HEADSHOT</b>: he kneels, a purple <b>crosshair locks on</b> the strongest enemy and his shot calls down a <b>sniper beam</b> from the sky.','New <b>splash art</b>: tap 🖼 ART on his Heroes page.']},
 {id:49,d:'Nov 20, 2026',ic:'⚡',t:'Dr. Ohm – new animations',l:['<b>Dr. Ohm</b> (Epic) got brand-new smooth animations: idle, run, attack, hit, KO and victory.','His <b>TESLA COIL</b> is now a real Tesla tower that crackles and zaps the enemies.','New splash art – tap <b>🖼 ART</b> on his hero page.']},
 {id:48,d:'Nov 20, 2026',ic:'🎨',t:'GLORIA – new animations',l:['<b>GLORIA</b> (Epic) has brand-new battle animations: idle, run, attack, skill, victory and knock-out.','Her skill <b>GLOSS WAVE</b> now sends a big glossy <b>paint wave</b> crashing on the enemies.','New <b>splash art</b>: tap 🖼 ART on her Heroes page.']},
 {id:47,d:'Nov 20, 2026',ic:'⚔️',t:'Smoother battles',l:['Heroes and monsters now fight <b>face to face</b> – no more standing inside each other.','No more slow motion when a hero uses a skill: battles keep their full speed.','Skill effects are prepared at the start of the battle, so the first ultimate no longer stutters.']},
 {id:46,d:'Nov 20, 2026',ic:'⚡',t:'SOFIA, OTTO & REX – new animations',l:['<b>SOFIA LIGHTNING</b>, <b>ORACLE OTTO</b> and <b>REX REDLINE</b> (Legendary) have brand-new battle animations: idle, run, attack, skill, victory and knock-out.','Their skills have new effects: Sofia\'s <b>storm cloud</b>, Otto\'s <b>All-Seeing Eye clock</b> and Rex\'s <b>fire trail explosion</b>.','New <b>splash art</b> for all three – tap <b>🖼 ART</b> on the HEROES page.']},
 {id:45,d:'Nov 20, 2026',ic:'🛠️',t:'Easier HEROES page',l:['<b>LEVEL UP</b> button right under the hero\'s power – green with ▲ when you have enough Essence. Hero cards show <b>Lv</b> at the top (green ▲ = can level up).','New <b>✎ EDIT TEAM</b> button on the HEROES page: tap mechanics to add them, tap a team slot to change – then DONE.','Every window now has a red <b>✕</b> at the top – no more scrolling down to close.','EVENTS: new reward bars and CLAIM buttons.']},
 {id:44,d:'Nov 20, 2026',ic:'🎨',t:'New look: EVENTS, Lucky Wheel & stars',l:['The <b>EVENTS</b> page has a new festive look with a big picture for every event.','The <b>LUCKY WHEEL</b> is now a real golden prize wheel.','New icons for <b>Essence</b>, <b>Gear Parts</b> and <b>Ascension</b>.','Mythic heroes and Ascended gear: every +5 the stars change to <b>red</b>, <b>purple</b> and <b>rainbow</b>.']},
 {id:43,d:'Nov 20, 2026',ic:'⭐',t:'Hero LEVELS, Essence, Gear Parts & EVENTS',l:['Heroes now have <b>levels 1 → 300</b>: HEROES page → <b>LEVEL UP</b> with <b>Essence</b>. Every <b>20 levels</b> = <b>ASCENSION</b>: +3% all stats, +1 skill level and +20 max level. Your heroes already got the level that fits your campaign progress.','<b>Essence</b>: Idle Rewards, campaign, Torque Tower, Class Towers, <b>every Dungeon</b> and duplicates of maxed heroes.','<b>Gear Parts</b> now pay for gear upgrades (salvage gives Gear Parts). Money is only for the garage.','<b>Mythic heroes</b> come from <b>Summon</b> (0.08%) – no more Fusion. Mythic stars go to <b>+20</b>: every +5 a new star color, more stats and +1 skill level. Duplicates of maxed heroes → Essence or Diamonds.','<b>Ascended gear</b> is in the Gear Summon (0.02%) and goes up to <b>★20</b> (new star color + new stat every 5).','Every workshop now takes only <b>its own class</b> (Legend = all). <b>✎ EDIT TEAM</b> before every battle (also Towers, Dungeons, World Boss).','New <b>⭐ EVENTS</b> (right side): Hero / Gear / Crew Summon, Essence Rush, Diamond Spree and the <b>Lucky Wheel</b> – milestone rewards + TOP 100 with prizes.']},
 {id:42,d:'Nov 19, 2026',ic:'⚖️',t:'Battle balance – ultimates',l:['With very high gear, heroes could fire their <b>ultimate</b> almost after every hit. Fixed.','<b>Skill charge</b> and <b>Attack speed</b> now count fully up to <b>+60%</b>; above that they grow slower (max <b>+120%</b> charge, <b>+150%</b> speed).','After an ultimate a hero does not charge for <b>3 seconds</b>. Ultimates are rarer, but every one is a real show again.']},
 {id:41,d:'Nov 19, 2026',ic:'💎',t:'DUKE DIAMOND – new animations',l:['<b>DUKE DIAMOND</b> (Legendary) has brand-new battle animations: idle, run, paint-blaster shot, victory and knock-out – 8 frames each.','<b>DIAMOND VORTEX</b>: he charges his golden blaster, fires a beam and a paint-and-diamond tornado rises on the biggest group – then it bursts into ice crystals that freeze the enemies.','New <b>splash art</b>: shown when you summon him, and with the <b>🖼 ART</b> button on the HEROES page.']},
 {id:40,d:'Nov 19, 2026',ic:'✨',t:'MAMA ROSA – new animations',l:['<b>MAMA ROSA</b> (Legendary) has brand-new battle animations: idle, run, wrench throw, victory and knock-out – 8 frames each.','<b>MIRACLE SHIFT</b>: she prays, raises her golden wrench and a pillar of holy light rises under every mechanic of the team.','New <b>splash art</b>: shown when you summon her, and with the <b>🖼 ART</b> button on the HEROES page.']},
 {id:39,d:'Nov 19, 2026',ic:'🔥',t:'LADY OVERDRIVE & GRIGORE – new animations',l:['<b>LADY OVERDRIVE</b> (Mythic) and <b>GRIGORE</b> (Legendary) have brand-new battle animations: idle, run, attack, victory and knock-out – 8 frames each.','<b>OVERDRIVE</b>: Lady blasts through the enemies on her jet engines, leaving a fire trail and a big explosion.','<b>IRON QUAKE</b>: Grigore smashes the ground and a wall of glowing rocks rolls through all enemies, then he raises his golden shield.','New <b>splash art</b> for both: shown when you summon them, and with the <b>🖼 ART</b> button on the HEROES page.']},
 {id:38,d:'Nov 19, 2026',ic:'👑',t:'THE TORQUE KING – new animations',l:['<b>THE TORQUE KING</b> (Mythic) has brand-new battle animations: smoother idle, run, attack, victory and knock-out – 8 frames each.','<b>GEAR APOCALYPSE</b>: a new skill animation – a burning gear halo, a beam of light, and a giant flaming gear crashing on the enemies.','New <b>splash art</b>: shown when you summon him, and with the <b>🖼 ART</b> button on his HEROES page.']},
 {id:37,d:'Nov 19, 2026',ic:'🔥',t:'GEAR GUIDE & new look',l:['<b>GEAR GUIDE</b>: tap the glowing <b>?</b> on the GEAR SUMMON page (or next to STARS / ASCEND in an item window) – pictures show how gear gets stronger than Mythic: Stars ★1-★5, then ASCEND.','<b>GEAR SUMMON</b> has its own forge background.','New windows, buttons, stars and progress bars.']},
 {id:36,d:'Nov 19, 2026',ic:'⭐',t:'Gear Stars, ASCENDED gear & new Summon tabs',l:['<b>SUMMON</b>: the 3 buttons at the bottom are now <b>HERO · CREW · GEAR</b> – switch between all summons in one tap. Rate Info = the (i) button, Summon History is inside it.','<b>GEAR STARS ★1-★5</b>: open an item → STAR UP. It uses one identical piece from the bag (same slot + same grade). Every star: +20% main stat.','<b>ASCENDED</b> – a new gear grade above Mythic: ASCEND a Mythic ★5 (uses 1 more Mythic of the same slot), or find it in campaign chapters 30-50. Max Lv 60 and 3 bonus stats.','Fixed texts: VIP Pass bonuses, ticket list, gear summon rates.']},
 {id:35,d:'Nov 19, 2026',ic:'⚔️',t:'New Arena fights + Gear Summon shortcut',l:['<b>ARENA</b> fights look brand new: heroes run in, fight up close, shoot real projectiles and every skill shows its <b>name</b>.','<b>GEAR SUMMON</b> is back on the SUMMON page – tap GEAR at the bottom.','Top 3 names on the ranking podium are now easy to read.']},
 {id:34,d:'Nov 18, 2026',ic:'👑',t:'VIP Passes stack + hero frames on profiles',l:['You can now have <b>Silver, Gold and Platinum Pass</b> at the same time. Every pass gives its own daily gift and the bonuses add up (VIP benefits, Idle hours).','A player\'s <b>profile</b> now shows his battle team in the <b>grade frames</b> – name and grade of every hero.']},
 {id:33,d:'Nov 18, 2026',ic:'⚙️',t:'Smarter AUTO EQUIP',l:['<b>AUTO EQUIP</b> now checks your hero\'s <b>class SET</b> first (2, 3, 4… pieces) and compares it with the best normal items – the gear with the most <b>Power</b> wins.']},
 {id:32,d:'Nov 18, 2026',ic:'👑',t:'Fixed: VIP level in Ranking & Chat',l:['The <b>VIP</b> badge in RANKING, CHAT and on profiles now shows your real <b>VIP level</b>. Before, some players were shown as VIP 20 by mistake.']},
 {id:31,d:'Nov 18, 2026',ic:'🛒',t:'New SHOP: packs, diamonds & passes',l:['The <b>SHOP</b> is brand new: <b>PACKS</b> (Starter, Rookie, Pro, Elite – each with a hero), <b>DIAMONDS</b> (double diamonds on your first buy of every pack), <b>VIP PASS</b> and <b>CAMPAIGN FUNDS</b>.','<b>VIP PASS</b>: <b>SILVER</b> (paid with diamonds), <b>GOLD</b> and <b>PLATINUM</b> – daily diamonds and tickets, more income, longer Idle Rewards and ×2 battle speed.','<b>CAMPAIGN FUND</b> (Normal or Hard): big rewards every 5 chapters.','Battle speed <b>×2</b> now costs only <b>€2.99</b>.']},
 {id:30,d:'Nov 18, 2026',ic:'💀',t:'HARD MODE & a tougher campaign',l:['<b>HARD MODE</b> is here! On the campaign map switch <b>NORMAL / HARD</b>: the same 1000 stages with much stronger monsters and <b>×1.5 rewards</b> (money, tickets, diamonds). HARD chapter N opens when you clear NORMAL chapter N.','The campaign from chapter 2 on is now <b>tougher</b> – the journey to chapter 50 lasts much longer. Stuck? <b>NEVER GIVE UP</b> still makes your team stronger every 6 hours on the same stage.','Torque Tower, Class Towers, Dungeons and World Boss are not changed.']},
 {id:29,d:'Nov 18, 2026',ic:'🎓',t:'Tutorial & a fairer economy',l:['New players now get a short <b>tutorial</b> with <b>Mama Rosa</b>, your chief mechanic – and a welcome gift at the end. Want to see it again? <b>Shop</b> → <b>Replay tutorial</b>.','The first time a new battle mode opens (Arena, Torque Tower, Dungeons, World Boss…) a short tip explains it.','<b>Economy</b>: money came in too fast, so upgrades were over too soon. Building levels 2-4 now cost more, the garage and campaign battles pay a bit less and reputation grows slower – your empire now grows step by step for months.']},
 {id:28,d:'Nov 17, 2026',ic:'✨',t:'Smoother pages & zoom',l:['Pages and windows now open with a short <b>fade-in</b>, only when all their pictures are ready – no more icons popping in late.','<b>Zoom</b> on the garage map is smoother: it settles on fixed steps, so zooming back is instant and the picture stays sharp.','<b>Cloud save</b>: the "Which game do you keep?" window no longer appears when the cloud holds the same game as your phone.']},
 {id:27,d:'Nov 17, 2026',ic:'🔑',t:'DUNGEONS are open!',l:['Open <b>BATTLE</b> → <b>DUNGEONS</b> (after campaign stage 1-16): <b>CASH VAULT</b>, <b>SCRAP MINE</b>, <b>GEAR FORGE</b> and <b>NITRO LAB</b> – 30 floors each.','<b>2 free keys a day</b> in every dungeon. A key is used <b>only when you win</b>.','Fixed rewards: <b>cash</b> (Vault), a <b>gear piece</b> (Mine), a <b>SET piece</b> (Forge), <b>NITRO BOOST</b> +HP & attack for 3 hours in Campaign and Towers (Lab).','<b>DUNGEON PASS</b> (30 days): +2 keys a day and <b>SWEEP</b>.']},
 {id:26,d:'Nov 17, 2026',ic:'🐍',t:'New World Boss: TOW SERPENT',l:['The fourth <b>WORLD BOSS</b> joins the weekly rotation: <b>TOW SERPENT</b>, a giant serpent of chains and crane hooks.','It is weak to <b>RACER</b> heroes: <b>+30%</b> damage. Its lunges hit everyone in front of it – many times!','Rotation every Monday: SCRAPZILLA → CRUSHER KING → INFERNO PISTON → TOW SERPENT.','The <b>WORLD BOSS</b> banner in the Battle Hub has a new look.']},
 {id:25,d:'Nov 17, 2026',ic:'🏆',t:'New World Bosses + Classic Collection makeover',l:['Two new <b>WORLD BOSSES</b> join the weekly rotation: <b>CRUSHER KING</b> (weak to <b>SCANNER</b>, many ground slams) and <b>INFERNO PISTON</b> (weak to <b>SPRAYER</b>, cone of fire).','A new boss comes every Monday: SCRAPZILLA → CRUSHER KING → INFERNO PISTON.','The <b>CLASSIC COLLECTION</b> has a new look: luxury showroom, golden tabs and a frame for every parked car.']},
 {id:24,d:'Nov 17, 2026',ic:'👹',t:'WORLD BOSS: SCRAPZILLA is here!',l:['Open <b>BATTLE</b> → <b>WORLD BOSS</b> (after campaign stage 2-1).','<b>3 BOSS KEYS</b> a day: each key = a <b>60-second</b> attack with your battle team. The boss cannot die – only your <b>damage</b> counts.','SCRAPZILLA is weak to <b>SHOCKER</b> heroes: <b>+30%</b> damage. Watch out – it ENRAGES in the last 20 seconds!','<b>Daily rewards</b> for your total damage of the day: diamonds, Recruit, Gear and Crew tickets – nothing is random.','<b>DAMAGE RANKING</b> every week: the top 100 of the server get diamonds and tickets by mail on Monday.']},
 {id:23,d:'Nov 17, 2026',ic:'🏆',t:'CLASSIC COLLECTION is open!',l:['Tap the <b>Collection Garage</b> on the map (REP 6) to open your private showroom.','The <b>DEALER</b> sells 12 classic cars, from Common to <b>Mythic</b> – each one can be owned once.','Every parked car gives <b>diamonds and tickets</b> while you are away – collect them with <b>IDLE</b>.','Fill all 6 spots: idle money <b>+10%</b>.']},
 {id:22,d:'Nov 17, 2026',ic:'📱',t:'Smoother garage map & bigger Battle Hub',l:['The garage map is <b>smoother</b> on cheaper phones: the area around the screen is prepared in advance, so no more blinking squares when you drag between the garages.','The picture quality no longer jumps up and down by itself (that caused flicker and extra lag).','<b>BATTLE HUB</b>: bigger mode buttons, less empty space.']},
 {id:21,d:'Nov 16, 2026',ic:'⚔️',t:'BATTLE HUB & CLASS TOWERS',l:['The <b>BATTLE</b> button now opens one page with <b>all battle modes</b>: Campaign, Arena, Torque Tower, Class Towers and Torque Cup – fewer buttons on the garage map.','New <b>CLASS TOWERS</b> (open after stage 1-20): 6 towers – Bruiser, Racer, Scanner, Medic, Sprayer, Shocker – <b>100 floors</b> each.','Only heroes of that class (+ <b>Legend</b> heroes) can fight. Each tower is open 2 days a week, <b>Sunday all are open</b>.','<b>Fixed rewards</b>: '+DMI+' every floor and a <b>SET PIECE</b> of that class every 5th floor (Rare → Epic → Legendary → Mythic).']},
 {id:20,d:'Nov 16, 2026',ic:'🗼',t:'TORQUE TOWER & 13 new monster looks',l:['New <b>TORQUE TOWER</b> (button under ARENA, opens after stage 1-10): <b>300 floors</b>, one fight per floor, a boss every 10 floors.','Most floors have a <b>modifier</b>: Rage, Iron Plating, Overdrive, Hot Floor, No Repairs or Sharp Edges – tap a floor to see it.','<b>Fixed rewards</b> (nothing random): '+DMI+' on every floor, tickets every 5th floor, big boss rewards every 10th floor.','New animated looks for <b>Battery Golem, Headlight Drone, Fuel Can Bomber, Wiper Mantis, Hubcap Saw, Gearbox Golem, Exhaust Bat, Horn Howler, ACID TANKER</b> and <b>OMEGA ENGINE</b>.','3 brand-new monsters: <b>Spark Wraith</b>, <b>Brake Beast</b> and <b>Airbag Blob</b> – in the campaign and in the tower.']},
 {id:19,d:'Nov 16, 2026',ic:'🔨',t:'New Gear Summon & info windows',l:['New <b>GEAR SUMMON</b> page: the forge with all 6 grades and their chances.','New <b>info windows</b> for Rate Info, Summon History and Tickets – every grade has its own colored row.','New <b>SET</b> panel on the hero page: lit pieces and bonus rows with ✓ / 🔒.','<b>HERO COLLECTION</b>: rainbow progress bar, ✓ and 🔒 on the chests.','<b>Crew</b> heroes now have their own class icon.']},
 {id:18,d:'Nov 16, 2026',ic:'🎨',t:'New Summon page, class icons & set pictures',l:['New <b>HERO SUMMON</b> and <b>CREW SUMMON</b> page: the best heroes stand on the portal, all 6 grades with a hero inside, bigger summon buttons.','New <b>class icons</b> (Bruiser, Racer, Scanner, Medic, Sprayer, Shocker, Legend) on every hero.','Every <b>set piece</b> now has its own picture – 42 new pieces! See the whole set on the hero page.','New <b>HERO COLLECTION</b> page with a chest for every color.']},
 {id:17,d:'Nov 16, 2026',ic:'🛡️',t:'Hero Sets & Hero Collection',l:['New <b>HERO SETS</b>: 7 sets (Iron Piston, Nitro Rush, Laser Scope, Field Medic, Color Storm, Thunder Coil, Torque King). Set pieces drop from <b>Rare</b> up in the campaign and in Gear Summon.','Every set belongs to one class – put it on a hero of that class: every piece from <b>2 to 6</b> unlocks a new battle bonus.','New <b>HERO COLLECTION</b> in HEROES: complete a color to give <b>all battle heroes</b> HP, Attack or Defense. It replaces the old Mechanics collection garage bonus.','Mythic heroes are now shown on the Summon page (they come only from Fusion).','Fixed: building level lights, Bag tabs and the Gear Summon subtitle.']},
 {id:16,d:'Nov 16, 2026',ic:'✨',t:'New look: buildings, campaign, crew & arena',l:['New <b>building window</b>: 10 level lights, every bonus with its next level, your crew and the upgrade button.','New <b>Campaign</b> header and a new <b>stage card</b>: enemies, VS power bar, rewards and your team before the fight.','New battle buttons: <b>pause</b>, <b>×1 / ×1.5 / ×2</b> and <b>AUTO</b>.','New <b>MY CREW</b>, <b>CHOOSE MECHANIC</b>, <b>AUTO BEST</b> and <b>GEAR SUMMON</b> pages.','<b>Arena</b>: new league shields, rival cards, FIGHT buttons, rankings and Cup frames.','New icons for Daily Quests, VIP, Shop, the left menu and the right menu (Rank, Chat, Check-in, News, Mail).','New <b>CREW SUMMON</b> header, new confirm windows and new message bar.']},
 {id:15,d:'Nov 16, 2026',ic:'🎨',t:'Brand-new look for the menus',l:['New top bar with your <b>'+DMI+' Diamonds</b> always visible.','New <b>Shop</b>, <b>VIP</b>, <b>News</b>, <b>Mail</b> and <b>Check-in</b> pages.','<b>HEROES</b>: your battle team now stands on the pedestals. Tap a hero to open his <b>gear page</b> – 6 slots around him and his stats below.','New <b>VICTORY</b> and <b>DEFEAT</b> screens after every battle.','New <b>BAG</b> page and a new <b>SALVAGE</b> page: salvage up to 20 items at once (worn gear is never salvaged).','New item card with <b>EQUIP</b> / <b>UPGRADE</b> / <b>SALVAGE</b>.','Online: new Ranking podium, Chat, Arena, Cup bracket (final 8) and Profile.','<b>Fixed</b>: the top bar of the <b>MY CREW</b> page was covered by an empty box.','<b>Fixed</b>: the hero gear page could stop working after equipping some gear.']},
 {id:14,d:'Nov 16, 2026',ic:'🦸',t:'New HEROES page – everything in one place',l:['Tap <b>HEROES</b> in the Campaign: your <b>battle team</b>, <b>all your heroes</b>, their <b>skills</b>, <b>gear</b> and <b>stars</b> – all on one page.','Tap a hero to see his skill and equip gear right there, then <b>➕ ADD TO BATTLE TEAM</b> (you always see before / after).','Stage card: <b>FIGHT!</b> starts right away with your team, or tap <b>✏️ HEROES</b> to change it.','The same team fights for you in the <b>Arena</b> and the <b>Torque Cup</b>.']},
 {id:14,d:'Nov 15, 2026',ic:'🛡️',t:'Passive skills + battle fixes',l:['<b>PASSIVE SKILLS</b>: every mechanic now has a passive skill that works on its own in battle – Epic, Legendary and Mythic have <b>two</b>. Medics heal by themselves, Bruisers take less damage, Racers speed up after a knock-out, Shockers chain lightning… Tap a mechanic (Team page or Gear page) to read his passives.','<b>Fixed</b>: monsters can no longer be pushed out of the screen.','<b>Fixed</b>: mechanics who fight up close no longer stand next to a monster without attacking – each one takes his own place around it.']},
 {id:13,d:'Nov 15, 2026',ic:'⚔️',t:'Online: Ranking, Chat, Arena & Torque Cup',l:['<b>🏆 LIVE RANKING</b> (top right): the best players of your server – campaign stage, team power and garage level, updated live.','<b>💬 WORLD CHAT</b> with <b>automatic translation</b>: write in your language, everyone reads it in theirs. Long-press a message to mute or report a player.','<b>⚔️ ARENA</b> (new button on the left): fight other players\' battle teams, climb from Bronze to <b>Legend</b>, 5 fights a day and a daily reward at 22:00.','<b>🏟️ TORQUE CUP</b> every weekend: the best 64 of the Arena in a knock-out tournament – the champion wins 2000 '+DMI+' and the <b>CUP CHAMPION</b> title.','<b>👤 PROFILE</b>: choose your player name (free the first time), your icon, a frame and a title.']},
 {id:12,d:'Nov 15, 2026',ic:'☁️',t:'Google cloud save',l:['You can now <b>sign in with Google</b> (optional) on the start screen or in Shop → <b>Cloud save</b>.','The start screen also shows your <b>server</b> – more servers will open as more players join.','Your game is kept safe and comes back on a new phone or after reinstalling.','We keep only an anonymous ID – never your e-mail or name. You can delete it any time.']},
 {id:11,d:'Nov 15, 2026',ic:'✨',t:'Gear upgrade animation',l:['Upgrading gear now plays an animation: <b>UPGRADE SUCCESS!</b> with the new level and the new bonus – you see the result right away.','The gear card flashes in the bag too, and the page no longer jumps to the top.','Pages no longer blink when they refresh (pictures stay on screen).']},
 {id:10,d:'Nov 14, 2026',ic:'🎬',t:'Better battles',l:['Skills now play in <b>slow motion</b> – you can see every special move (at ×1, ×1.5 and ×2).','Mechanics no longer stand on top of each other.','All battles use the new effects.']},
 {id:9,d:'Nov 14, 2026',ic:'⚖️',t:'Balance update',l:['<b>Legendary and Mythic</b> mechanics are stronger. Stars after +5 give a bit less on low grades, so a new Legendary now beats an Uncommon +50.','<b>Chapter bosses</b> from Chapter 5 on are easier.','<b>NEVER GIVE UP</b> keeps growing: after 2 days your mechanics train faster (+15% every 6 h, up to +300%). Nobody stays stuck for long.','Building levels 6-10 cost more. Your garage now grows over several months.','Battle cards now show every mechanic\'s face. Mechanics only show the effects from their own animation.']},
 {id:8,d:'Nov 14, 2026',ic:'👾',t:'New monster art in the campaign',l:['10 monsters are fully redrawn and animated: <b>Piston Imp, Tire Rat, Exhaust Snake, Bolt Crawler, Scrap Hound, Crankshaft Brute</b>.','New mini-boss: the <b>Turbo Wasp</b> (a different colour in every world).','New chapter bosses: <b>Junkyard Titan</b>, <b>Nitro Dragon</b> and the <b>Tow King</b>.','Every monster now walks, attacks, uses its skill, gets hit and falls apart with its own animation.']},
 {id:7,d:'Nov 14, 2026',ic:'💎',t:'Diamonds, 5000 free summons & the VIP Truck',l:['<b>5000 FREE SUMMONS</b>: claim 10 Recruit + 10 Crew + 10 Gear tickets every day (the calendar at the top right).','<b>Diamonds</b> 💎: earned in the campaign (bosses give 100), Daily Quest gifts and new Rep / VIP levels. No tickets? <b>100 💎 = 1 summon</b> – you are always asked first.','<b>Legendary pity bar</b>: a Legendary is guaranteed every <b>500</b> summons.','Your garages are now <b>linked to the Car Wash and the Gas Station</b>: dirty cars get washed, and everybody fills up with our <b>diesel at −50%</b>.','Bosses now also give <b>Crew Tickets</b>. Money comes a bit slower – the game lasts longer.','New in the Shop: <b>VIP Truck</b> with rich clients (priority in every garage) and <b>VIP Crew Boost</b> (every mechanic +25%). The VIP Pass is now <b>×1.5</b>.']},
 {id:6,d:'Nov 14, 2026',ic:'🎉',t:'Check-in, News, Mail & Reputation 30',l:['<b>Daily Check-in</b>: log in every day for free Recruit and Crew tickets. Day 7 is the big one – and a missed day never resets your week.','<b>News</b> (this page) and <b>Mail</b> with gifts from the Torque Studios team.','<b>Reputation now goes up to 30</b>: every level after Rep 6 raises your car sale prices (+3%) and idle income (+4%). Rep 10, 15, 20, 25 and 30 give bonus tickets.','Building upgrades after LV 4 are now called <b>Steps</b> (5 steps per level) – they cost only money.']},
 {id:5,d:'Nov 14, 2026',ic:'👮',t:'All Security guards are here',l:['<b>29 guards</b> from Common to Mythic with new art and animations – The Wall and Night Hawk are the Mythic ones.','<b>6 new thieves</b> try their luck at night. Catch them and they leave in handcuffs!']},
 {id:4,d:'Nov 14, 2026',ic:'🛵',t:'New drivers & the Crew summon',l:['<b>All drivers</b> have new art – from Zippy Zack to the Mythic Apex and Midnight Rider.','Drivers and guards now come from one <b>Crew summon</b> with its own <b>Crew Tickets</b>.','Your heroes now <b>work on the map</b> as small figures inside the garages.']},
 {id:3,d:'Nov 14, 2026',ic:'⚔️',t:'Every hero has a unique skill',l:['All mechanics have <b>new animations</b> in battle and <b>their own unique skill</b>.','Hero cards in battle show their <b>grade frame</b>.','<b>AUTO NEXT</b>: after a win, the next stage starts by itself with the same team.']},
 {id:2,d:'Nov 14, 2026',ic:'📱',t:'Smoother on every phone',l:['The game now uses <b>much less battery and processor</b> (max 60 FPS, lighter map and menus).','Fixed battles that would not start on some older phones.','Updates download faster and only ask you to tap <b>OK</b> – no surprise restarts.']},

const UPD={on:false,t0:0,p:0};
function updShow(){if(UPD.on||started)return;UPD.on=true;UPD.t0=Date.now();window.__UPD=1;const d=document.createElement('div');d.id='updS';
  d.innerHTML='<div class="uB"><img src="img/ui/upd_panel.webp" alt=""><div class="uT"><b>NEW VERSION</b><span id="updTx">Downloading the update…</span><small>Your progress is safe</small></div><div class="uG"><i id="updF"></i><em id="updP">0%</em></div></div>';
  $('loader').appendChild(d);setTimeout(()=>{if(UPD.on&&!started&&Date.now()-UPD.t0>=89e3){UPD.on=false;window.__UPD=0;d.remove();}},9e4);}   // never stuck: after 90 s the game can start anyway
function updPct(v){UPD.p=Math.max(UPD.p,Math.min(100,v));const f=$('updF'),q=$('updP');if(f)f.style.width=UPD.p+'%';if(q)q.textContent=Math.round(UPD.p)+'%';}
if('serviceWorker' in navigator&&location.protocol==='https:'){const hadSW=!!navigator.serviceWorker.controller;let upd=false;
  navigator.serviceWorker.addEventListener('message',e=>{const m=e.data;if(!m||m.te!=='upd'||!hadSW||started)return;updShow();updPct(m.t?95*m.d/m.t:5);});
  navigator.serviceWorker.register('sw.js').then(reg=>{const chk=()=>reg.update().catch(()=>{});
    reg.addEventListener('updatefound',()=>{if(hadSW&&!started){updShow();updPct(3);}});if(hadSW){chk();setTimeout(chk,1200);setTimeout(chk,4000);}   // check for a new version right at the start (again a bit later: the first check can be skipped by the browser while the page is still loading)
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk();});setInterval(chk,15*60*1000);}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadSW||upd)return;upd=true;
    if(!started){updShow();updPct(100);const t=$('updTx');if(t)t.textContent='Update installed – starting…';setTimeout(()=>location.reload(),600);return;}   // v16-124: not playing yet → restart by itself

      d.addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;
        if(b.dataset.u==='ok'){try{save();}catch(er){}d.remove();setTimeout(()=>location.reload(),150);}else d.remove();});
