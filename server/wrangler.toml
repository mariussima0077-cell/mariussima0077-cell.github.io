# Torque Guard – Cloudflare takes this folder from GitHub automatically (Workers Builds, root directory: server)
name = "torque-guard"
main = "worker.js"
compatibility_date = "2026-11-01"
keep_vars = true          # keep the secrets/variables you add in the dashboard (ADMIN_KEY, GOOGLE_SA)

[vars]
PACKAGE_NAME = "com.torqueempire.game"
INTEGRITY = "log"         # v16-105 Play Integrity: "log" = only written down (/admin) · "enforce" = online + cloud save only for the real app on a real phone
GOOGLE_CLIENT_ID = "1041720099519-ogooa4hblh8d4s96ieervv9rp7bqh2k5.apps.googleusercontent.com"      # Google sign-in: the OAuth Web client ID (public, not a secret) – see PLAY_RULES.md

[triggers]
crons = ["*/10 * * * *"]   # the bot checks all players every 10 minutes

[[d1_databases]]
binding = "DB"
database_name = "torque_guard"
database_id = "322aec9e-ddaa-4741-874e-5a2105c89523"

# v16-45: automatic chat translation (Cloudflare Workers AI – free daily quota; if it is used up, players see the original text)
[ai]
binding = "AI"
