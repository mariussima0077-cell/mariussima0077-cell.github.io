<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torque Empire – Discord reward</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1019 url(banner.png) center/cover no-repeat;font-family:system-ui,sans-serif;color:#fff}
.box{background:#0b1019ee;border:2px solid #ffb300;border-radius:18px;padding:22px 20px;max-width:360px;margin:16px;text-align:center;box-shadow:0 10px 40px #000a}
h1{font-size:22px;margin:8px 0}p{line-height:1.5;color:#dfe6ee}img{width:84px;height:84px;border-radius:50%}
a.b{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:12px;background:#5865F2;color:#fff;font-weight:800;text-decoration:none}
.r{color:#ffd54a;font-weight:800}
</style></head><body><div class="box"><img src="icon.png" alt=""><h1 id="t">Checking…</h1><p id="m">Please wait a moment.</p><div id="x"></div></div>
<script>
// v16-320: Discord sends the player back here with #access_token (implicit OAuth, scope guilds.members.read) and state = "<playerId>.<gameVersion>".
// We give the token to Torque Guard, which asks Discord if the player is on the Torque Empire server → reward in the game MAIL.
(async()=>{
  const API='https://torque-guard.torqueempirehelp.workers.dev', INV='https://discord.gg/KGAJNc7Wcb';
  const T=document.getElementById('t'),M=document.getElementById('m'),X=document.getElementById('x');
  const h=new URLSearchParams(location.hash.slice(1)), at=h.get('access_token'), st=h.get('state')||'', i=st.lastIndexOf('.');
  const pid=i>0?st.slice(0,i):'', cv=+st.slice(i+1)||0;
  history.replaceState(null,'',location.pathname);   // the token never stays in the address bar
  const show=(t,m,btn)=>{T.textContent=t;M.innerHTML=m;X.innerHTML=btn||'';};
  if(h.get('error')){show('Cancelled','You did not allow Discord. Go back to the game and try again.');return;}
  if(!at||pid.length<8){show('Something is missing','Open this page from the game: <b>PROFILE → 💬 DISCORD REWARD</b>.');return;}
  let r={};try{r=await (await fetch(API+'/api/on/dlink',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pid,cv,at})})).json();}catch(e){r={err:'network'};}
  if(r.ok){show('🎉 Reward sent!','<span class="r">500 💎 + 10 Recruit + 10 Gear + 10 Crew tickets</span><br>are waiting in your game <b>MAIL</b>.<br><br>Go back to the game. Follow <b>#announcements</b> on Discord for gift codes and the next updates!');return;}
  const E={notmember:['Join our server first','You are not on the Torque Empire Discord yet. Join it, then come back to the game and tap <b>GET REWARD</b> again.','<a class="b" href="'+INV+'">JOIN DISCORD</a>'],
    used:['Already used','This Discord account already gave its reward to another game account.'],
    done:['Already claimed','You already got the Discord reward. Check your game <b>MAIL</b>.'],
    online:['Go online first','Open the game with internet once (so you have a player name), then try again.'],
    update:['Update the game','Your game is too old. Update it, then try again.'],
    auth:['Login expired','Go back to the game and tap <b>GET REWARD</b> again.'],
    slow:['Too fast','Wait 2 minutes and try again.']};
  const e=E[r.err]||['Could not check','Discord or the internet did not answer. Try again in a moment.'];show(e[0],e[1],e[2]);
})();
</script></body></html>
