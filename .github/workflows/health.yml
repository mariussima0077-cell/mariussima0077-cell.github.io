# v16-318 🩺 SERVER ALERTS (Marius 25 nov 2026): every 10 min + after every push → new server problems go to the private
# Discord channel #admin-alerts (ping 🛠️ Developer). A NEW red problem also fails this run → GitHub sends an e-mail.
name: Server health (alerts)

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: discord
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for the new server + game to go live (after a push)
        if: ${{ github.event_name == 'push' }}
        run: sleep 210
      - name: Check the server and post new alerts
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: node discord/health.mjs ${{ github.event_name == 'push' && 'push' || '' }}
