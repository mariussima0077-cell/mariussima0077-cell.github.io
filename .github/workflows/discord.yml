name: Discord (Torque Bot)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "announce = post in #announcements | setup / migrate / community = server admin (already done)"
        type: choice
        options: [announce, setup, migrate, community, tweaks, betatest]
        default: announce
      kind:
        description: "soon = upcoming update (what it will contain) | live = update is out now"
        type: choice
        options: [soon, live]
        default: live
      version:
        description: "Version, e.g. v16-150"
        required: false
      notes:
        description: "Contents separated by | (e.g. New hero|Arena fix|Faster loading)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup server
        if: ${{ inputs.action == 'setup' }}
        run: node discord/setup.mjs
      - name: Restructure server
        if: ${{ inputs.action == 'migrate' }}
        run: node discord/migrate.mjs
      - name: Community + Onboarding
        if: ${{ inputs.action == 'community' }}
        run: node discord/community.mjs
      - name: Beta-test channel
        if: ${{ inputs.action == 'betatest' }}
        run: node discord/betatest.mjs
      - name: Tweaks
        if: ${{ inputs.action == 'tweaks' }}
        run: node discord/tweaks.mjs
      - name: Announce update
        if: ${{ inputs.action == 'announce' }}
        env:
          PLAY_URL: ${{ vars.PLAY_URL }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          KIND: ${{ inputs.kind }}
        run: node discord/announce.mjs "$VERSION" "$NOTES" "$KIND"
