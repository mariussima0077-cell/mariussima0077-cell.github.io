# 👋 WELCOME PING (Marius 26 nov 2026): every 5 min Torque Bot greets each new Discord member in #welcome with an @tag + rules + where to go.
name: Discord welcome (Torque Bot)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: discord-greet
  cancel-in-progress: false

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: discord
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Greet new members
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: node discord/greet.mjs
